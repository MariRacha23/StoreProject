<div class="profile-container">

  @if (message()) {
  <div class="status-message" [ngClass]="message()?.type">
    {{ message()?.text }}
  </div>
  }

  <div class="profile-grid">
    <div class="profile-card">
      <h2><i class="fa-solid fa-user"></i> Personal Info</h2>
      <form [formGroup]="profileForm" (ngSubmit)="updateInfo()">
        <div class="form-group">
          <label>First Name</label>
          <input type="text" formControlName="firstName">
        </div>
        <div class="form-group">
          <label>Last Name</label>
          <input type="text" formControlName="lastName">
        </div>
        <div class="form-group">
          <label>Email (Permanent)</label>
          <input type="email" formControlName="email">
        </div>
        <div class="form-group">
          <label>Phone</label>
          <input type="text" formControlName="phone">
        </div>
        <button type="submit" class="btn-update btn-primary">Update Info</button>
      </form>
    </div>

    <div class="profile-card security-card">
      <h2><i class="fa-solid fa-lock"></i> Security</h2>
      <form [formGroup]="passwordForm" (ngSubmit)="updatePassword()">
        <div class="form-group">
          <label>Old Password</label>
          <input type="password" formControlName="oldPassword" placeholder="••••••••">
        </div>
        <div class="form-group">
          <label>New Password</label>
          <input type="password" formControlName="newPassword" placeholder="Min. 6 characters">
        </div>
        <button type="submit" class="btn-update btn-danger">Update Password</button>
      </form>
    </div>
  </div>
</div>
