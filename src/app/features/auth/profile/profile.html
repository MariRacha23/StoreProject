<div class="profile-container">
  @if (message()) {
  <div class="status-message" [ngClass]="message()?.type">
    {{ message()?.text }}
  </div>
  }

  <div class="profile-grid">
    <div class="profile-card info-card">
      <h2><i class="fa-solid fa-user-gear"></i> Personal Details</h2>
      <form [formGroup]="profileForm" (ngSubmit)="updateInfo()" class="dynamic-form">

        <div class="avatar-section">
          <img [src]="profileForm.get('avatar')?.value || 'https://goo.su/m69vH'" alt="Avatar" class="profile-img">
          <div class="form-group">
            <label>Avatar URL</label>
            <input type="text" formControlName="avatar" placeholder="Image link...">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>First Name</label>
            <input type="text" formControlName="firstName">
          </div>
          <div class="form-group">
            <label>Last Name</label>
            <input type="text" formControlName="lastName">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Age</label>
            <input type="number" formControlName="age">
          </div>
          <div class="form-group">
            <label>Gender</label>
            <select formControlName="gender">
              <option value="MALE">Male</option>
              <option value="FEMALE">Female</option>
              <option value="OTHER">Other</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label>Email (Permanent)</label>
          <input type="email" formControlName="email">
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Phone</label>
            <input type="text" formControlName="phone">
          </div>
          <div class="form-group">
            <label>Zipcode</label>
            <input type="text" formControlName="zipcode">
          </div>
        </div>

        <div class="form-group">
          <label>Address</label>
          <textarea formControlName="address" rows="2"></textarea>
        </div>

        <button type="submit" class="btn-update btn-primary" [disabled]="profileForm.invalid">
          <i class="fa-solid fa-save"></i> Save Profile Changes
        </button>
      </form>
    </div>

    <div class="side-column">
      <div class="profile-card security-card">
        <h2><i class="fa-solid fa-shield-halved"></i> Security</h2>
        <form [formGroup]="passwordForm" (ngSubmit)="updatePassword()">
          <div class="form-group">
            <label>Old Password</label>
            <input type="password" formControlName="oldPassword" placeholder="••••••••">
          </div>
          <div class="form-group">
            <label>New Password</label>
            <input type="password" formControlName="newPassword" placeholder="Min. 6 characters">
          </div>
          <button type="submit" class="btn-update btn-warning">Update Password</button>
        </form>
      </div>

      <div class="profile-card danger-card">
        <h2><i class="fa-solid fa-triangle-exclamation"></i> Danger Zone</h2>
        <p>Once you delete your account, there is no going back.</p>
        <div class="danger-actions">
          <button class="btn-outline" (click)="logout()">Sign Out</button>
          <button class="btn-danger" (click)="deleteMyAccount()">Delete Account</button>
        </div>
      </div>
    </div>
  </div>
</div>
